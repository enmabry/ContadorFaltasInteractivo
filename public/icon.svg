<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Deep Obsidian/Navy Background with Notion-style micro radius -->
  <rect width="512" height="512" rx="96" fill="#0a1530" />
  
  <!-- Subtle Outer Hairline Border -->
  <rect x="16" y="16" width="480" height="480" rx="80" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
  
  <!-- The Iron Cage: Architectural Grid Matrix (Max Weber concept) -->
  <g stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5">
    <!-- Vertical Institutional Bars -->
    <line x1="96" y1="64" x2="96" y2="448" />
    <line x1="176" y1="64" x2="176" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="336" y1="64" x2="336" y2="448" />
    <line x1="416" y1="64" x2="416" y2="448" />
    
    <!-- Horizontal Schedule Bars -->
    <line x1="64" y1="96" x2="448" y2="96" />
    <line x1="64" y1="176" x2="448" y2="176" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="336" x2="448" y2="336" />
    <line x1="64" y1="416" x2="448" y2="416" />
  </g>

  <!-- The Iron Cage Outer Frame Accent -->
  <rect x="88" y="88" width="336" height="336" rx="8" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2.5" fill="none" />

  <!-- WEBER Monogram: Architectural 'W' constructed of rational geometric struts -->
  <path
    d="M136 144 L192 368 L256 224 L320 368 L376 144"
    stroke="#ffffff"
    stroke-width="34"
    stroke-linecap="square"
    stroke-linejoin="miter"
    stroke-miterlimit="4"
  />

  <!-- Rational Center Focal Dot: Signature Purple focal point (mastery over the cage) -->
  <circle cx="256" cy="144" r="16" fill="#7b61ff" />
  <circle cx="256" cy="144" r="6" fill="#ffffff" />
</svg>
